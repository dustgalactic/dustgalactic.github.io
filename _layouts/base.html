<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  {%- include head.html -%}

  <body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    {%- include header.html -%}

    <main id="main-content" class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    {%- include sub-footer.html -%}

    {% if page.layout == 'post' %}
      {%- include post-links.html -%}
    {% endif %}
  </body>

</html>
