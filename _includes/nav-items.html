<div class="nav-items">
  {%- for path in include.paths -%}
  {%- assign hyperpage = site.pages | where: "path", path | first -%}
  {%- if hyperpage.title %}
  <a class="nav-item{% if page.url == hyperpage.url %} is-active{% endif %}" href="{{ hyperpage.url | relative_url }}"{% if page.url == hyperpage.url %} aria-current="page"{% endif %}>{{ hyperpage.title | escape }}</a>
  {%- endif -%}
  {%- endfor %}
</div>
