<ul class="social-media-list">
{%- for entry in site.minima.social_links -%}
  <li>
    <a rel="me noopener noreferrer" href="{{ entry.url }}" target="_blank" aria-label="{{ entry.title }} (opens in a new tab)">
      {% if entry.icon == "linkedin" %}
      <svg class="svg-icon grey" aria-hidden="true" viewBox="0 0 16 16">
        <path d="M0 1.15C0 .52.52 0 1.15 0h13.7C15.48 0 16 .52 16 1.15v13.7c0 .63-.52 1.15-1.15 1.15H1.15C.52 16 0 15.48 0 14.85V1.15zm4.94 12.25V6.17H2.53v7.23h2.41zM3.73 5.18c.84 0 1.36-.56 1.36-1.25-.02-.71-.52-1.25-1.34-1.25-.82 0-1.36.54-1.36 1.25 0 .69.52 1.25 1.32 1.25h.02zm2.54 8.22h2.41V9.36c0-.22.02-.43.08-.59.17-.43.56-.88 1.22-.88.86 0 1.2.65 1.2 1.61v3.9h2.41V9.22c0-2.24-1.2-3.28-2.8-3.28-1.29 0-1.87.71-2.19 1.21h.02v-.98H6.27c.03.65 0 7.23 0 7.23z"/>
      </svg>
      {% elsif entry.icon == "github" %}
      <svg class="svg-icon grey" aria-hidden="true" viewBox="0 0 16 16">
        <path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.23.49-2.7-1.08-2.7-1.08-.37-.93-.9-1.18-.9-1.18-.73-.5.06-.49.06-.49.81.06 1.24.83 1.24.83.72 1.23 1.89.88 2.35.67.07-.52.28-.88.51-1.08-1.78-.2-3.65-.89-3.65-3.96 0-.88.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.12 0 0 .68-.22 2.2.82A7.7 7.7 0 0 1 8 3.73a7.7 7.7 0 0 1 2.01.27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.52.56.83 1.27.83 2.15 0 3.08-1.87 3.75-3.66 3.95.29.25.54.74.54 1.5l-.01 2.22c0 .21.14.46.55.38A8 8 0 0 0 8 0z"/>
      </svg>
      {% else %}
      <span aria-hidden="true">{{ entry.title }}</span>
      {% endif %}
    </a>
  </li>
{%- endfor -%}
{% unless site.minima.hide_site_feed_link %}
  <li>
    <a href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}" target="_blank" rel="noopener noreferrer" aria-label="RSS feed (opens in a new tab)">
      <svg class="svg-icon grey" aria-hidden="true" viewBox="0 0 16 16">
        <path d="M12.8 16C12.8 8.978 7.022 3.2 0 3.2V0c8.777 0 16 7.223 16 16h-3.2zM2.194 11.61c1.21 0 2.195.985 2.195 2.196 0 1.21-.99 2.194-2.2 2.194C.98 16 0 15.017 0 13.806c0-1.21.983-2.195 2.194-2.195zM10.606 16h-3.11c0-4.113-3.383-7.497-7.496-7.497v-3.11c5.818 0 10.606 4.79 10.606 10.607z"/>
      </svg>
    </a>
  </li>
{%- endunless %}
</ul>
